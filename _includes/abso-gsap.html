  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {

    if (typeof gsap === 'undefined') return;

        if (typeof navigator !== 'undefined' && navigator.vibrate) {
          try { navigator.vibrate([14, 25, 14]); } catch(e){}
        }
      },

        if (typeof navigator !== 'undefined' && navigator.vibrate) {
          try { navigator.vibrate([8, 18, 8, 18, 12]); } catch(e){}
        }
      },

        if (typeof navigator !== 'undefined' && navigator.vibrate) {
          try { navigator.vibrate([12, 30, 20]); } catch(e){}
        }
      },
      heartbeat: function() {
        if (typeof navigator !== 'undefined' && navigator.vibrate) {
          try { navigator.vibrate([8, 35, 8]); } catch(e){}
        }
      },
      dualPulse: function() {
        if (typeof navigator !== 'undefined' && navigator.vibrate) {
          try { navigator.vibrate([12, 20, 12]); } catch(e){}

        if (typeof navigator !== 'undefined' && navigator.vibrate) {

    interactiveElements.forEach(function(el) {
      el.addEventListener('pointerdown', function() {
        haptic.tap();
        gsap.to(this, {
          scaleX: 1.08,
          scaleY: 0.92,
          duration: 0.12,
          ease: 'power2.out',
          overwrite: 'auto'
        });
      });

      function releaseSquash() {
        gsap.to(el, {
          scaleX: 1,
          scaleY: 1,
          duration: 0.65,
          ease: 'elastic.out(1.2, 0.38)',
          overwrite: 'auto'
        });
      }

      el.addEventListener('pointerup', releaseSquash);
      el.addEventListener('pointercancel', releaseSquash);
      el.addEventListener('pointerleave', releaseSquash);
    });

    // 2. HAMBURGER MASCOT BUTTON TACTILE POP
    // =========================================================================
    var menuToggle = document.getElementById('abso-menu-toggle');
    if (menuToggle) {
      menuToggle.addEventListener('click', function() {
        haptic.bump();
        gsap.fromTo(this, 
          { scale: 0.88, rotation: -10 },
          { scale: 1, rotation: 0, duration: 0.45, ease: 'elastic.out(1.3, 0.45)', overwrite: 'auto' }
        );
      });

        // Cyan Single Soul Orb
        '<svg viewBox="0 0 32 32" width="28" height="28" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="grad_two_c2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#67e8f9"/><stop offset="50%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#0e7490"/></linearGradient></defs><circle cx="16" cy="16" r="13" fill="url(#grad_two_c2)" stroke="#ffffff" stroke-width="2.2"/><circle cx="12" cy="12" r="4" fill="#ffffff" opacity="0.88"/></svg>',
        // Magenta Single Soul Orb
        '<svg viewBox="0 0 32 32" width="28" height="28" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="grad_two_m2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#f472b6"/><stop offset="50%" stop-color="#db2777"/><stop offset="100%" stop-color="#9d174d"/></linearGradient></defs><circle cx="16" cy="16" r="13" fill="url(#grad_two_m2)" stroke="#ffffff" stroke-width="2.2"/><circle cx="12" cy="12" r="4" fill="#ffffff" opacity="0.88"/></svg>'
      ],

      duet: [
        // Concentric Dual-Tone Rhythm Ring (Red + Blue)
        '<svg viewBox="0 0 42 42" width="36" height="36" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="grad_duet_r" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ff6b6b"/><stop offset="100%" stop-color="#c92a2a"/></linearGradient><linearGradient id="grad_duet_b" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#4dabf7"/><stop offset="100%" stop-color="#1864ab"/></linearGradient></defs><circle cx="21" cy="21" r="18" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="2"/><path d="M 21 6 A 15 15 0 0 1 21 36" fill="none" stroke="url(#grad_duet_r)" stroke-width="4.5" stroke-linecap="round"/><path d="M 21 36 A 15 15 0 0 1 21 6" fill="none" stroke="url(#grad_duet_b)" stroke-width="4.5" stroke-linecap="round"/><circle cx="21" cy="21" r="4.5" fill="#ffffff"/></svg>',

        '<svg viewBox="0 0 32 32" width="28" height="28" xmlns="http://www.w3.org/2000/svg"><circle cx="16" cy="16" r="13" fill="#e62429" stroke="#ffffff" stroke-width="2.5"/><circle cx="16" cy="16" r="6" fill="#ffffff" opacity="0.75"/></svg>',

        '<svg viewBox="0 0 44 44" width="38" height="38" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="grad_mb_chk" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ffe066"/><stop offset="50%" stop-color="#f59f00"/><stop offset="100%" stop-color="#d9480f"/></linearGradient></defs><circle cx="22" cy="22" r="18" fill="none" stroke="url(#grad_mb_chk)" stroke-width="3"/><circle cx="22" cy="22" r="13" fill="none" stroke="#fff" stroke-width="1.2" opacity="0.8"/><line x1="22" y1="4" x2="22" y2="40" stroke="url(#grad_mb_chk)" stroke-width="2.5"/><line x1="4" y1="22" x2="40" y2="22" stroke="url(#grad_mb_chk)" stroke-width="2.5"/><line x1="9.3" y1="9.3" x2="34.7" y2="34.7" stroke="url(#grad_mb_chk)" stroke-width="2.5"/><line x1="9.3" y1="34.7" x2="34.7" y2="9.3" stroke="url(#grad_mb_chk)" stroke-width="2.5"/><circle cx="22" cy="22" r="5" fill="#fff" stroke="#d9480f" stroke-width="2"/><circle cx="22" cy="22" r="2" fill="#d9480f"/></svg>',
        // Fiery Divine Astra Spark
        '<svg viewBox="0 0 32 32" width="28" height="28" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="grad_mb_fire" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#fff3bf"/><stop offset="40%" stop-color="#ff922b"/><stop offset="100%" stop-color="#e03131"/></linearGradient></defs><path d="M 16 2 Q 16 16 30 16 Q 16 16 16 30 Q 16 16 2 16 Q 16 16 16 2 Z" fill="url(#grad_mb_fire)" stroke="#fff" stroke-width="1.2"/><circle cx="16" cy="16" r="3" fill="#ffffff"/></svg>'
      ],

      theDot: [
        // Crimson Red Cartoon Dot
        '<svg viewBox="0 0 36 36" width="30" height="30" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="grad_dot_r" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ff6b6b"/><stop offset="70%" stop-color="#e62429"/><stop offset="100%" stop-color="#a61e22"/></linearGradient></defs><circle cx="18" cy="18" r="15" fill="url(#grad_dot_r)" stroke="#ffffff" stroke-width="2.5"/><circle cx="13" cy="15" r="2.2" fill="#ffffff"/><circle cx="23" cy="15" r="2.2" fill="#ffffff"/><path d="M 14 21 Q 18 25 22 21" stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>',
        // Sunflower Gold Winking Dot
        '<svg viewBox="0 0 36 36" width="30" height="30" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="grad_dot_g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ffe066"/><stop offset="70%" stop-color="#f59f00"/><stop offset="100%" stop-color="#d9480f"/></linearGradient></defs><circle cx="18" cy="18" r="15" fill="url(#grad_dot_g)" stroke="#ffffff" stroke-width="2.5"/><circle cx="13" cy="15" r="2.2" fill="#ffffff"/><path d="M 21 15 L 25 15" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/><path d="M 14 21 Q 18 25 22 21" stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>',
        // Electric Cyan Happy Dot
        '<svg viewBox="0 0 36 36" width="30" height="30" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="grad_dot_c" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#67e8f9"/><stop offset="70%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#0e7490"/></linearGradient></defs><circle cx="18" cy="18" r="15" fill="url(#grad_dot_c)" stroke="#ffffff" stroke-width="2.5"/><circle cx="13" cy="15" r="2.2" fill="#ffffff"/><circle cx="23" cy="15" r="2.2" fill="#ffffff"/><path d="M 14 21 Q 18 25 22 21" stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>'
      ]
    };

    function spawnGameParticles(gameType, originX, originY) {
      var tokenList = GAME_TOKENS[gameType] || GAME_TOKENS.samosa;
      var count = (gameType === 'mahabharata') ? 7 : (gameType === 'twosome' ? 5 : 6);

      // Trigger dedicated haptic pattern
      if (gameType === 'mahabharata') haptic.battle();
      else if (gameType === 'twosome') haptic.dualPulse();
      else if (gameType === 'runLittleOne') haptic.heartbeat();
      else if (gameType === 'duet') haptic.tap();
      else if (gameType === 'theDot') haptic.wiggle();
      else haptic.burst();

      for (var i = 0; i < count; i++) {
        var p = document.createElement('div');
        p.className = 'abso-game-particle';
        var svgContent = tokenList[i % tokenList.length];
        p.innerHTML = svgContent;
        p.style.left = (originX - 18) + 'px';
        p.style.top = (originY - 16) + 'px';
        document.body.appendChild(p);

        var tl = gsap.timeline({
          onComplete: (function(elem) {
            return function() {
              if (elem.parentNode) elem.parentNode.removeChild(elem);
            };
          })(p)
        });

        if (gameType === 'runLittleOne') {
          // Gentle floating wool/crystal drift in soft breeze
          var bX = gsap.utils.random(-75, 75);
          var bY = gsap.utils.random(-110, -180);
          tl.to(p, {
            x: bX,
            y: bY,
            rotation: gsap.utils.random(-90, 90),
            scale: gsap.utils.random(0.9, 1.25),
            duration: gsap.utils.random(0.5, 0.65),
            ease: 'power1.out'
          })
          .to(p, {
            x: bX + gsap.utils.random(-30, 30),
            y: bY - gsap.utils.random(30, 60),
            opacity: 0,
            scale: 0.8,
            duration: gsap.utils.random(0.65, 0.85),
            ease: 'sine.out'
          });
        } else if (gameType === 'twosome') {
          // Intertwined orbiting spiral burst
          var tX = gsap.utils.random(-95, 95);
          var tY = gsap.utils.random(-130, -200);
          tl.to(p, {
            x: tX,
            y: tY,
            rotation: gsap.utils.random(-360, 360),
            scale: gsap.utils.random(0.9, 1.3),
            duration: 0.48,
            ease: 'power2.out'
          })
          .to(p, {
            x: tX + gsap.utils.random(-40, 40),
            y: tY + gsap.utils.random(80, 130),
            rotation: '+=180',
            opacity: 0,
            duration: 0.65,
            ease: 'power1.in'
          });
        } else if (gameType === 'duet') {
          // High-speed acoustic pulse expansion
          var dX = gsap.utils.random(-70, 70);
          var dY = gsap.utils.random(-80, -150);
          tl.to(p, {
            x: dX,
            y: dY,
            scale: gsap.utils.random(1.4, 1.9),
            duration: 0.38,
            ease: 'power2.out'
          })
          .to(p, {
            scale: 2.3,
            opacity: 0,
            duration: 0.5,
            ease: 'power1.out'
          });
        } else if (gameType === 'mahabharata') {
          // Explosive spinning golden chakras & fierce fiery sparks
          var mX = gsap.utils.random(-110, 110);
          var mY = gsap.utils.random(-160, -250);
          var spin = gsap.utils.random(-540, 540);
          tl.to(p, {
            x: mX,
            y: mY,
            rotation: spin,
            scale: gsap.utils.random(1.0, 1.45),
            duration: 0.42,
            ease: 'power2.out'
          })
          .to(p, {
            x: mX + gsap.utils.random(-25, 25),
            y: mY + gsap.utils.random(130, 180),
            rotation: spin + gsap.utils.random(-180, 180),
            opacity: 0,
            duration: 0.65,
            ease: 'power2.in'
          });
        } else if (gameType === 'theDot') {
          // Bouncy rubber ball pop with elastic bounce
          var dotX = gsap.utils.random(-85, 85);
          var dotY = gsap.utils.random(-140, -210);
          tl.to(p, {
            x: dotX,
            y: dotY,
            scale: gsap.utils.random(0.95, 1.35),
            duration: 0.35,
            ease: 'power1.out'
          })
          .to(p, {
            y: dotY + 90,
            duration: 0.55,
            ease: 'bounce.out'
          })
          .to(p, {
            opacity: 0,
            scale: 0.6,
            duration: 0.25,
            ease: 'power1.in'
          });
        } else {
          // Samosa gravity tumble
          var sX = gsap.utils.random(-90, 90);
          var sY = gsap.utils.random(-130, -210);
          var sSpin = gsap.utils.random(-240, 240);
          tl.to(p, {
            x: sX,
            y: sY,
            rotation: sSpin,
            scale: gsap.utils.random(0.85, 1.3),
            duration: 0.45,
            ease: 'power2.out'
          })
          .to(p, {
            y: sY + gsap.utils.random(130, 180),
            x: sX + gsap.utils.random(-20, 20),
            rotation: sSpin + gsap.utils.random(-60, 60),
            opacity: 0,
            duration: 0.65,
            ease: 'power2.in'
          });
        }
      }
    }

    // 1. Attach particle triggers on Game Cards (Homepage & Games Page)
    var cardMappings = [
      { selector: '.abso-card a[href*="mb-cow"]', type: 'mahabharata' },
      { selector: '.abso-card a[href*="samosa-catcher"]', type: 'samosa' },
      { selector: '.abso-card a[href*="run-little-one"]', type: 'runLittleOne' },
      { selector: '.abso-card a[href*="twosome"]', type: 'twosome' },
      { selector: '.abso-card a[href*="duet"]', type: 'duet' },
      { selector: '.abso-panel--dot a[href*="the-dot"], .abso-panel--dot', type: 'theDot' }
    ];

    cardMappings.forEach(function(item) {
      var elements = document.querySelectorAll(item.selector);
      elements.forEach(function(el) {
        el.addEventListener('pointerdown', function(e) {
          var x = e.clientX || (window.innerWidth / 2);
          var y = e.clientY || (window.innerHeight / 2);
          spawnGameParticles(item.type, x, y);
        });
      });
    });

    // 2. Attach particle triggers on Dedicated Game Pages
    var currentPath = window.location.pathname.replace(/\/$/, '') || '/';
    var pageGameType = null;
    if (currentPath.indexOf('mb-cow') !== -1) pageGameType = 'mahabharata';
    else if (currentPath.indexOf('samosa-catcher') !== -1) pageGameType = 'samosa';
    else if (currentPath.indexOf('run-little-one') !== -1) pageGameType = 'runLittleOne';
    else if (currentPath.indexOf('twosome') !== -1) pageGameType = 'twosome';
    else if (currentPath.indexOf('duet') !== -1) pageGameType = 'duet';
    else if (currentPath.indexOf('the-dot') !== -1) pageGameType = 'theDot';

    if (pageGameType) {
      var pageElements = document.querySelectorAll(
        '.banner-wrapper, .banner-overlay, .info-banner-wrapper, .info-card, .img-rounded, .main-logo, .dot-section'
      );
      pageElements.forEach(function(el) {
        el.addEventListener('pointerdown', function(e) {
          var x = e.clientX || (window.innerWidth / 2);
          var y = e.clientY || (window.innerHeight / 2);
          spawnGameParticles(pageGameType, x, y);
        });
      });
    }


    // =========================================================================
    // 4. MAHABHARATA CODE OF WAR HERO GOLDEN LIGHT SHEEN & PARALLAX
    // =========================================================================
    var heroCard = document.querySelector('.abso-card--hero');
    if (heroCard) {
      var sheen = heroCard.querySelector('.abso-hero-sheen');
      if (!sheen) {
        sheen = document.createElement('div');
        sheen.className = 'abso-hero-sheen';
        sheen.setAttribute('aria-hidden', 'true');
        heroCard.appendChild(sheen);
      }

      if (typeof ScrollTrigger !== 'undefined') {
        gsap.fromTo(sheen,
          { xPercent: -120 },
          {
            xPercent: 120,
            duration: 1.4,
            ease: 'power2.inOut',
            scrollTrigger: {
              trigger: heroCard,
              start: 'top 85%',
              toggleActions: 'play none none none'
            }
          }
        );
      }

      heroCard.addEventListener('pointerenter', function() {
        gsap.fromTo(sheen,
          { xPercent: -120 },
          { xPercent: 120, duration: 1.1, ease: 'power1.inOut', overwrite: 'auto' }
        );
      });
    }


    // =========================================================================
    // 5. TACTILE 3D TILT & PARALLAX FOR SHOWCASE CARDS
    // =========================================================================
    var cards = document.querySelectorAll('.abso-card--hero, .abso-card--narrow');
    var isFinePointer = window.matchMedia && window.matchMedia('(pointer: fine)').matches;

    cards.forEach(function(card) {
      if (isFinePointer) {
        card.style.transformStyle = 'preserve-3d';
        card.style.perspective = '1000px';

      function initAudio() {
        if (!audioCtx) {

            if (AudioContextClass) audioCtx = new AudioContextClass();
          } catch(e){}
        }
        if (audioCtx && audioCtx.state === 'suspended') {

      function playSynthTone(freq, type, duration, gainLevel, freqEnd) {
        if (isMuted || !audioCtx) return;
        try {
          var osc = audioCtx.createOscillator();
          var gain = audioCtx.createGain();
          osc.type = type || 'sine';
          var t = audioCtx.currentTime;
          osc.frequency.setValueAtTime(freq, t);
          if (freqEnd) {
            osc.frequency.exponentialRampToValueAtTime(Math.max(20, freqEnd), t + duration);
          }
          gain.gain.setValueAtTime(gainLevel || 0.12, t);
          gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(t);
          osc.stop(t + duration);
        } catch(e){}
      }

        if (!disguiseLayer) return;
        Object.keys(DISGUISES).forEach(function(key) {
          var item = DISGUISES[key];
          if (count >= item.milestone && !unlockedDisguises[key]) {
            unlockedDisguises[key] = true;
            unlockedKeys.push(key);
            activeDisguiseMode = key; // Automatically equip newly unlocked costume!

            var elem = document.createElement('div');
            elem.className = 'abso-dot-disguise-item';
            elem.style.position = 'absolute';
            elem.style.top = item.top;
            elem.style.right = item.right;
            elem.style.width = item.width;
            elem.style.height = item.height;
            elem.style.zIndex = item.zIndex;
            elem.innerHTML = item.svg;
            disguiseLayer.appendChild(elem);
            disguiseElements[key] = elem;

            updateDisguiseVisibility();

            gsap.fromTo(elem, 
              { scale: 0, y: -30, rotation: -15 },
              { scale: 1, y: 0, rotation: 0, duration: 0.65, ease: 'elastic.out(1.3, 0.4)' }
            );

            showUnlockToast('NEW DISGUISE: ' + item.name);
          }
        });
      }

      // -----------------------------------------------------------------------
      // D. FEVER MODE (50 COIN JACKPOT CELEBRATION)
      // -----------------------------------------------------------------------
      function triggerFeverMode() {
        if (isFeverMode) return;
        isFeverMode = true;
        sfxFanfare();
        haptic.burst();

        if (dotPanel) dotPanel.classList.add('is-fever-mode');

        var banner = document.createElement('div');
        banner.className = 'abso-fever-banner';
        banner.innerHTML = '<span aria-hidden="true">⚡</span> FEVER MODE! UNSTOPPABLE NOM! <span aria-hidden="true">🥳</span>';
        document.body.appendChild(banner);

        gsap.to(banner, { scale: 1, duration: 0.45, ease: 'elastic.out(1.3, 0.4)' });

        // Blast golden confetti & sparks
        for (var i = 0; i < 22; i++) {
          (function() {
            var spark = document.createElement('div');
            spark.className = 'abso-fever-spark';
            spark.innerHTML = (i % 2 === 0) ? '✨' : '⭐';
            spark.style.fontSize = gsap.utils.random(18, 28) + 'px';
            spark.style.left = gsap.utils.random(10, window.innerWidth - 30) + 'px';
            spark.style.top = gsap.utils.random(40, window.innerHeight * 0.7) + 'px';
            document.body.appendChild(spark);

            gsap.to(spark, {
              y: '-=' + gsap.utils.random(60, 160),
              x: '+=' + gsap.utils.random(-80, 80),
              rotation: gsap.utils.random(-180, 180),
              opacity: 0,
              duration: gsap.utils.random(0.8, 1.4),
              ease: 'power2.out',
              onComplete: function() {
                if (spark.parentNode) spark.parentNode.removeChild(spark);
              }
            });
          })();
        }

        clearTimeout(feverTimer);
        feverTimer = setTimeout(function() {
          isFeverMode = false;
          if (dotPanel) dotPanel.classList.remove('is-fever-mode');
          gsap.to(banner, {
            scale: 0,
            opacity: 0,
            duration: 0.35,
            ease: 'power2.in',
            onComplete: function() {
              if (banner.parentNode) banner.parentNode.removeChild(banner);
            }
          });
        }, 6000);
      }

      // -----------------------------------------------------------------------
      // E. COLLECTION LOGIC
      // -----------------------------------------------------------------------
      function collectCoin(x, y, multiplier) {
        var pts = (multiplier || (isFeverMode ? 2 : 1));
        collectedCount += pts;
        if (coinCountSpan) coinCountSpan.textContent = collectedCount;

        // Sounds & Haptics
        sfxCoin();
        sfxNom();
        haptic.tap();

        // Check milestones
        if (collectedCount >= 50 && (collectedCount - pts < 50)) {
          triggerFeverMode();
        } else if (collectedCount % 100 === 0) {
          triggerFeverMode();
        }
        checkDisguiseUnlocks(collectedCount);

        // Bouncy pulse on counter badge
        if (coinCounterElem) {
          gsap.killTweensOf(coinCounterElem);
          gsap.fromTo(coinCounterElem, 
            { scale: 1.35 }, 
            { scale: 1, duration: 0.35, ease: 'elastic.out(1.4, 0.4)' }
          );
        }

        // Dot banner chew squash reaction
        if (dotPanel) {
          var dotImg = dotPanel.querySelector('img');
          if (dotImg) {
            gsap.to(dotImg, { scaleX: 1.05, scaleY: 0.94, duration: 0.08, yoyo: true, repeat: 1, ease: 'power1.inOut' });
          }
        }

        // Floating comic pop text
        var pop = document.createElement('div');
        pop.className = 'abso-coin-pop-text';
        var comicWords = pts > 2 ? ['+5x CRITICAL FLING! 💥', 'SUPER NOM! 🚀'] : 
          (isFeverMode ? ['+2 🪙 FEVER! 🔥', 'NOM! 😋', 'CHOMP! ⚡'] : ['+1 🪙', 'NOM! 😋', 'CHOMP! 🍪', 'YUM! ✨', '+100 pts! 🪙']);
        pop.textContent = comicWords[Math.floor(Math.random() * comicWords.length)];
        pop.style.left = (x - 20) + 'px';
        pop.style.top = (y - 14) + 'px';
        document.body.appendChild(pop);

        gsap.timeline({
          onComplete: function() {
            if (pop.parentNode) pop.parentNode.removeChild(pop);
          }
        })
        .to(pop, {
          y: -42,
          scale: 1.3,
          duration: 0.28,
          ease: 'power2.out'
        })
        .to(pop, {
          opacity: 0,
          scale: 0.75,
          duration: 0.2,
          ease: 'power1.in'
        });
      }

      // -----------------------------------------------------------------------
      // F. PINBALL GAME CARD RICOCHETS
      // -----------------------------------------------------------------------
      var gameCards = document.querySelectorAll('.abso-card');
      function checkCardRicochet(coinX, coinY) {
        if (!gameCards.length || Math.random() > 0.35) return null;
        for (var i = 0; i < gameCards.length; i++) {
          var card = gameCards[i];
          var r = card.getBoundingClientRect();
          if (r.top < window.innerHeight && r.bottom > 0) {
            // Card is visible; check proximity to corners
            var cx = r.left + r.width / 2;
            var cy = r.top + r.height / 2;
            var dist = Math.hypot(coinX - cx, coinY - cy);
            if (dist < r.width * 0.45) {
              // Ricochet collision!
              sfxRicochet();
              gsap.to(card, { scale: 1.015, duration: 0.08, yoyo: true, repeat: 1, ease: 'power1.out' });

              // Spawn tiny spark
              var sp = document.createElement('div');
              sp.className = 'abso-pinball-spark';
              sp.innerHTML = '✨';
              sp.style.fontSize = '18px';
              sp.style.left = coinX + 'px';
              sp.style.top = coinY + 'px';
              document.body.appendChild(sp);
              gsap.to(sp, { scale: 1.4, opacity: 0, duration: 0.3, onComplete: function() {
                if (sp.parentNode) sp.parentNode.removeChild(sp);
              }});

              return {
                ricochetX: coinX + gsap.utils.random(-50, 50),
                ricochetY: coinY + gsap.utils.random(-25, 35)
              };
            }
          }
        }
        return null;
      }

      // -----------------------------------------------------------------------
      // G. SUBWAY SURFERS COIN STREAM ENGINE WITH SLINGSHOT BULLET-TIME
      // -----------------------------------------------------------------------
      var lastScrollY = window.pageYOffset || document.documentElement.scrollTop;
      var accumulatedScroll = 0;
      var activeCoinCount = 0;
      var maxCoinsOnScreen = 32;
      var lastSpawnTime = 0;
      var hamburgerBtn = document.getElementById('abso-menu-toggle') || document.querySelector('.hamburger-btn');

      function pulseHamburgerDispenser() {
        if (!hamburgerBtn) return;
        var hRect = hamburgerBtn.getBoundingClientRect();
        if (hRect.bottom > 0 && hRect.top < window.innerHeight) {
          gsap.killTweensOf(hamburgerBtn);
          gsap.timeline()
            .to(hamburgerBtn, { scale: 1.15, rotation: gsap.utils.random(-8, 8), duration: 0.06, ease: 'power2.out' })
            .to(hamburgerBtn, { scale: 1, rotation: 0, duration: 0.26, ease: 'elastic.out(1.4, 0.4)' });
        }
      }

      function spawnSubwaySurferCoin() {
        if (activeCoinCount >= maxCoinsOnScreen) return;
        activeCoinCount++;

        var coin = document.createElement('div');
        coin.className = 'abso-falling-coin';
        coin.innerHTML = (Math.random() > 0.4) ? COIN_SVG_STAR : COIN_SVG_DOT;

        // 1. ORIGIN: Exact coordinates of the hamburger menu dispenser
        var startX, startY;
        if (hamburgerBtn) {
          var menuRect = hamburgerBtn.getBoundingClientRect();
          startX = menuRect.left + menuRect.width / 2;
          startY = Math.max(24, menuRect.top + menuRect.height / 2);
        } else {
          startX = window.innerWidth - 45;
          startY = 35;
        }

        pulseHamburgerDispenser();

        coin.style.left = startX + 'px';
        coin.style.top = startY + 'px';
        document.body.appendChild(coin);

        // 2. TARGET: The Dot character banner
        var dotRect = dotPanel ? dotPanel.getBoundingClientRect() : null;
        var targetX, targetY;

        if (dotRect && dotRect.top < window.innerHeight && dotRect.bottom > 0) {
          targetX = dotRect.left + dotRect.width * 0.73;
          targetY = dotRect.top + dotRect.height * 0.5;
        } else if (dotRect && dotRect.top >= window.innerHeight) {
          targetX = Math.min(window.innerWidth - 60, Math.max(60, dotRect.left + dotRect.width * 0.73));
          targetY = window.innerHeight + 50;
        } else if (dotRect && dotRect.bottom <= 0) {
          targetX = Math.min(window.innerWidth - 60, Math.max(60, dotRect.left + dotRect.width * 0.73));
          targetY = -40;
        } else {
          targetX = window.innerWidth * 0.75;
          targetY = window.innerHeight * 0.6;
        }

        // 3. ARC BULGE & RICOCHET
        var arcBulgeX = gsap.utils.random(-140, -45);
        var midX = (startX + targetX) / 2 + arcBulgeX;
        var midY = (startY + targetY) / 2 + gsap.utils.random(-25, 45);

        var ricochet = checkCardRicochet(midX, midY);
        if (ricochet) {
          midX = ricochet.ricochetX;
          midY = ricochet.ricochetY;
        }

        var duration = gsap.utils.random(0.48, 0.68);
        var scale = gsap.utils.random(0.9, 1.25);
        var spinY = gsap.utils.random(540, 1080) * (Math.random() > 0.5 ? 1 : -1);
        var spinZ = gsap.utils.random(-180, 180);

        var tl = gsap.timeline({
          onComplete: function() {
            if (coin.parentNode) coin.parentNode.removeChild(coin);
            activeCoinCount--;
          }
        });

        // 4. INTERACTIVE SLINGSHOT FLING & MID-AIR CATCH
        var isSlingshot = false;
        var dragStartX = 0, dragStartY = 0;

        coin.addEventListener('pointerdown', function(e) {
          e.stopPropagation();
          haptic.burst();
          isSlingshot = true;
          tl.timeScale(0.1); // BULLET-TIME SLOW MOTION!
          coin.classList.add('is-aiming');
          dragStartX = e.clientX;
          dragStartY = e.clientY;

          function onPointerMove(ev) {
            if (!isSlingshot) return;
            var dx = ev.clientX - dragStartX;
            var dy = ev.clientY - dragStartY;
            gsap.set(coin, { x: '+=' + (dx * 0.3), y: '+=' + (dy * 0.3) });
          }

          function onPointerUp() {
            if (!isSlingshot) return;
            isSlingshot = false;
            window.removeEventListener('pointermove', onPointerMove);
            window.removeEventListener('pointerup', onPointerUp);
            coin.classList.remove('is-aiming');
            tl.kill();

            // ROCKET FLING DIRECTLY INTO THE DOT!
            sfxSlingshot();
            var currentPos = coin.getBoundingClientRect();
            gsap.to(coin, {
              left: targetX,
              top: targetY,
              x: 0,
              y: 0,
              scale: 0.1,
              opacity: 0,
              duration: 0.22,
              ease: 'power4.in',
              onComplete: function() {
                if (coin.parentNode) coin.parentNode.removeChild(coin);
                activeCoinCount--;
                collectCoin(targetX, targetY, 5); // +5x CRITICAL FLING!
              }
            });
          }

          window.addEventListener('pointermove', onPointerMove);
          window.addEventListener('pointerup', onPointerUp, { once: true });
        });

        // Phase 1: Arcade dispenser ejection & lateral sweep outward
        tl.to(coin, {
          x: midX - startX,
          y: midY - startY,
          scale: scale * 1.18,
          rotationY: spinY * 0.42,
          rotationZ: spinZ * 0.42,
          duration: duration * 0.4,
          ease: 'sine.out'
        })
        // Phase 2: Strong magnetic acceleration & vacuum suction towards The Dot
        .to(coin, {
          x: targetX - startX,
          y: targetY - startY,
          scale: scale * 0.32,
          rotationY: spinY,
          rotationZ: spinZ,
          duration: duration * 0.6,
          ease: 'power3.in'
        })
        // Phase 3: Vacuum ingestion into The Dot
        .to(coin, {
          scale: 0.05,
          opacity: 0,
          duration: 0.07,
          ease: 'power4.in',
          onComplete: function() {
            var popX = Math.max(30, Math.min(window.innerWidth - 60, targetX));
            var popY = Math.max(30, Math.min(window.innerHeight - 40, targetY));
            collectCoin(popX, popY);
          }
        });
      }

      // Scroll listener: emits coins from hamburger button in an arcade stream
      window.addEventListener('scroll', function() {
        var currentY = window.pageYOffset || document.documentElement.scrollTop;
        var delta = Math.abs(currentY - lastScrollY);
        lastScrollY = currentY;

        accumulatedScroll += delta;
        var now = Date.now();

        var threshold = isFeverMode ? 24 : 38;
        var throttle = isFeverMode ? 40 : 55;

        if (accumulatedScroll >= threshold && (now - lastSpawnTime > throttle)) {
          accumulatedScroll = 0;
          lastSpawnTime = now;
          spawnSubwaySurferCoin();

          if (delta > 42 && activeCoinCount < maxCoinsOnScreen) {
            setTimeout(function() {
              spawnSubwaySurferCoin();
            }, 30);
            if (delta > 75 || isFeverMode) {
              setTimeout(function() {
                spawnSubwaySurferCoin();
              }, 60);
            }
          }
        }
      }, { passive: true });

      // Easter egg: tapping hamburger mascot fires a festive mini-fountain!
      if (hamburgerBtn) {
        hamburgerBtn.addEventListener('click', function() {
          var bursts = isFeverMode ? 6 : 4;
          for (var i = 0; i < bursts; i++) {
            (function(idx) {
              setTimeout(function() {
                spawnSubwaySurferCoin();
              }, idx * 60);
            })(i);
          }
        });
      }

      // -----------------------------------------------------------------------
      // H. CLAY DUST FOOTSTEPS & THE DOT CURSOR GRAVITY
      // -----------------------------------------------------------------------
      var lastDustTime = 0;
      window.addEventListener('pointermove', function(e) {
        var now = Date.now();
        // Emit tiny clay dust puffs throttled every 70ms
        if (now - lastDustTime > 70) {
          lastDustTime = now;
          var dust = document.createElement('div');
          dust.className = 'abso-clay-dust';
          dust.style.left = e.clientX + 'px';
          dust.style.top = e.clientY + 'px';
          var size = gsap.utils.random(6, 12);
          dust.style.width = size + 'px';
          dust.style.height = size + 'px';
          document.body.appendChild(dust);

          gsap.to(dust, {
            scale: 2,
            opacity: 0,
            duration: 0.45,
            ease: 'power2.out',
            onComplete: function() {
              if (dust.parentNode) dust.parentNode.removeChild(dust);
            }
          });
        }

        // The Dot cursor gravity tilt
        if (dotPanel) {
          var dRect = dotPanel.getBoundingClientRect();
          if (dRect.top < window.innerHeight && dRect.bottom > 0) {
            var dotX = dRect.left + dRect.width * 0.73;
            var dotY = dRect.top + dRect.height * 0.5;
            var dist = Math.hypot(e.clientX - dotX, e.clientY - dotY);
            if (dist < 400) {
              var tilt = ((e.clientX - dotX) / 400) * 8;
              var img = dotPanel.querySelector('img');
              if (img) {
                gsap.to(img, { rotation: tilt, duration: 0.3, ease: 'power1.out', overwrite: 'auto' });
              }
            }
          }
        }
      }, { passive: true });
    }

  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initAbsoGsap);
  } else {
    initAbsoGsap();
  }
})();
</script>
