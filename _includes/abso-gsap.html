<!-- abso. GSAP Motion & Tactile Physics Engine (v0.4.1.2-GSAP) -->
<script src="{{ '/assets/js/vendor/gsap.min.js' | relative_url }}"></script>
<script src="{{ '/assets/js/vendor/ScrollTrigger.min.js' | relative_url }}"></script>

<script>
(function() {
  'use strict';

  // Respect user preference for reduced motion
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    return;
  }

  function initAbsoGsap() {
    if (typeof gsap === 'undefined') return;

    if (typeof ScrollTrigger !== 'undefined') {
      gsap.registerPlugin(ScrollTrigger);
    }

    // =========================================================================
    // 1. CLAY DOUGH "SQUASH & STRETCH" TACTILE PHYSICS
    // =========================================================================
    var interactiveElements = document.querySelectorAll(
      '.hamburger-btn, .abso-logo-link, .abso-nav-overlay .nav-links li a, .abso-footer__links a'
    );

    interactiveElements.forEach(function(el) {
      // Squash on press
      el.addEventListener('pointerdown', function() {
        gsap.to(this, {
          scaleX: 1.08,
          scaleY: 0.92,
          duration: 0.12,
          ease: 'power2.out',
          overwrite: 'auto'
        });
      });

      // Elastic rubbery recovery on release
      function releaseSquash() {
        gsap.to(el, {
          scaleX: 1,
          scaleY: 1,
          duration: 0.65,
          ease: 'elastic.out(1.2, 0.38)',
          overwrite: 'auto'
        });
      }

      el.addEventListener('pointerup', releaseSquash);
      el.addEventListener('pointercancel', releaseSquash);
      el.addEventListener('pointerleave', releaseSquash);
    });


    // =========================================================================
    // 2. SCROLL-DRIVEN "WALKING DOTS" & FOOTSTEP WOBBLE (ScrollTrigger)
    // =========================================================================
    var walkingDots = document.querySelector('.abso-walking-dots');
    if (walkingDots && typeof ScrollTrigger !== 'undefined') {
      // Horizontal walking stroll across track tied directly to scroll progress
      gsap.fromTo(walkingDots, 
        { x: -28 },
        {
          x: 28,
          ease: 'none',
          scrollTrigger: {
            trigger: walkingDots,
            start: 'top 95%',
            end: 'bottom 10%',
            scrub: 0.6
          }
        }
      );

      // Subtle lifelike walking bob (feet stepping rhythm)
      gsap.to(walkingDots, {
        y: -3,
        duration: 0.55,
        repeat: -1,
        yoyo: true,
        ease: 'power1.inOut'
      });
    }


    // =========================================================================
    // 3. TACTILE 3D TILT & PARALLAX FOR SHOWCASE CARDS
    // =========================================================================
    var cards = document.querySelectorAll('.abso-card--hero, .abso-card--narrow');
    var isFinePointer = window.matchMedia && window.matchMedia('(pointer: fine)').matches;

    cards.forEach(function(card) {
      // Card scroll entrance micro-polish
      if (typeof ScrollTrigger !== 'undefined') {
        gsap.fromTo(card, 
          { y: 16, opacity: 0.94 },
          {
            y: 0,
            opacity: 1,
            duration: 0.6,
            ease: 'power2.out',
            scrollTrigger: {
              trigger: card,
              start: 'top 88%',
              toggleActions: 'play none none none'
            }
          }
        );
      }

      // 3D perspective tilt on hover/pointer move (desktop & fine pointers)
      if (isFinePointer) {
        card.style.transformStyle = 'preserve-3d';
        card.style.perspective = '1000px';

        card.addEventListener('pointermove', function(e) {
          var rect = this.getBoundingClientRect();
          var x = (e.clientX - rect.left) / rect.width - 0.5;
          var y = (e.clientY - rect.top) / rect.height - 0.5;

          gsap.to(this, {
            rotationY: x * 6,
            rotationX: -y * 6,
            transformPerspective: 800,
            duration: 0.35,
            ease: 'power2.out',
            overwrite: 'auto'
          });
        });

        card.addEventListener('pointerleave', function() {
          gsap.to(this, {
            rotationX: 0,
            rotationY: 0,
            duration: 0.75,
            ease: 'elastic.out(1, 0.45)',
            overwrite: 'auto'
          });
        });
      }
    });


    // =========================================================================
    // 4. HAMBURGER MASCOT BUTTON TACTILE POP
    // =========================================================================
    var menuToggle = document.getElementById('abso-menu-toggle');
    if (menuToggle) {
      menuToggle.addEventListener('click', function() {
        gsap.fromTo(this, 
          { scale: 0.88, rotation: -10 },
          { scale: 1, rotation: 0, duration: 0.45, ease: 'elastic.out(1.3, 0.45)', overwrite: 'auto' }
        );
      });
    }

    // =========================================================================
    // 5. "THE DOT" & LOGO PLAYFUL MICRO-PHYSICS
    // =========================================================================
    var theDotImage = document.querySelector('.abso-panel--dot img, .dot-section img');
    if (theDotImage) {
      theDotImage.addEventListener('pointerenter', function() {
        gsap.to(this, { scale: 1.04, y: -4, duration: 0.25, ease: 'power1.out' });
      });
      theDotImage.addEventListener('pointerleave', function() {
        gsap.to(this, { scale: 1, y: 0, duration: 0.55, ease: 'elastic.out(1.2, 0.4)' });
      });
    }

    // Playful wobble for the abso. red dot in header logo on click/tap
    var logoImg = document.querySelector('.abso-logo');
    if (logoImg) {
      logoImg.addEventListener('pointerenter', function() {
        gsap.to(this, { scale: 1.05, duration: 0.18, ease: 'power1.out' });
      });
      logoImg.addEventListener('pointerleave', function() {
        gsap.to(this, { scale: 1, duration: 0.4, ease: 'elastic.out(1.1, 0.4)' });
      });
    }

    // Playful wobble for the abso. red dot in header logo on click/tap
    var logoImg = document.querySelector('.abso-logo');
    if (logoImg) {
      logoImg.addEventListener('pointerenter', function() {
        gsap.to(this, { scale: 1.05, duration: 0.18, ease: 'power1.out' });
      });
      logoImg.addEventListener('pointerleave', function() {
        gsap.to(this, { scale: 1, duration: 0.4, ease: 'elastic.out(1.1, 0.4)' });
      });
    }

  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initAbsoGsap);
  } else {
    initAbsoGsap();
  }
})();
</script>
