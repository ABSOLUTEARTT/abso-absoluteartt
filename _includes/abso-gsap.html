  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {

    if (typeof gsap === 'undefined') return;

        if (typeof navigator !== 'undefined' && navigator.vibrate) {
          try { navigator.vibrate([14, 25, 14]); } catch(e){}
        }
      },

        if (typeof navigator !== 'undefined' && navigator.vibrate) {
          try { navigator.vibrate([8, 18, 8, 18, 12]); } catch(e){}
        }
      },

        if (typeof navigator !== 'undefined' && navigator.vibrate) {
          try { navigator.vibrate([12, 30, 20]); } catch(e){}
        }
      },
      heartbeat: function() {
        if (typeof navigator !== 'undefined' && navigator.vibrate) {
          try { navigator.vibrate([8, 35, 8]); } catch(e){}
        }
      },
      dualPulse: function() {
        if (typeof navigator !== 'undefined' && navigator.vibrate) {
          try { navigator.vibrate([12, 20, 12]); } catch(e){}

        if (typeof navigator !== 'undefined' && navigator.vibrate) {

    interactiveElements.forEach(function(el) {
      el.addEventListener('pointerdown', function() {
        haptic.tap();
        gsap.to(this, {
          scaleX: 1.08,
          scaleY: 0.92,
          duration: 0.12,
          ease: 'power2.out',
          overwrite: 'auto'
        });
      });

      function releaseSquash() {
        gsap.to(el, {
          scaleX: 1,
          scaleY: 1,
          duration: 0.65,
          ease: 'elastic.out(1.2, 0.38)',
          overwrite: 'auto'
        });
      }

      el.addEventListener('pointerup', releaseSquash);
      el.addEventListener('pointercancel', releaseSquash);
      el.addEventListener('pointerleave', releaseSquash);
    });

    // 2. HAMBURGER MASCOT BUTTON TACTILE POP
    // =========================================================================
    var menuToggle = document.getElementById('abso-menu-toggle');
    if (menuToggle) {
      menuToggle.addEventListener('click', function() {
        haptic.bump();
        gsap.fromTo(this, 
          { scale: 0.88, rotation: -10 },
          { scale: 1, rotation: 0, duration: 0.45, ease: 'elastic.out(1.3, 0.45)', overwrite: 'auto' }
        );
      });

        // Cyan Single Soul Orb
        '<svg viewBox="0 0 32 32" width="28" height="28" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="grad_two_c2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#67e8f9"/><stop offset="50%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#0e7490"/></linearGradient></defs><circle cx="16" cy="16" r="13" fill="url(#grad_two_c2)" stroke="#ffffff" stroke-width="2.2"/><circle cx="12" cy="12" r="4" fill="#ffffff" opacity="0.88"/></svg>',
        // Magenta Single Soul Orb
        '<svg viewBox="0 0 32 32" width="28" height="28" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="grad_two_m2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#f472b6"/><stop offset="50%" stop-color="#db2777"/><stop offset="100%" stop-color="#9d174d"/></linearGradient></defs><circle cx="16" cy="16" r="13" fill="url(#grad_two_m2)" stroke="#ffffff" stroke-width="2.2"/><circle cx="12" cy="12" r="4" fill="#ffffff" opacity="0.88"/></svg>'
      ],

      duet: [
        // Concentric Dual-Tone Rhythm Ring (Red + Blue)
        '<svg viewBox="0 0 42 42" width="36" height="36" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="grad_duet_r" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ff6b6b"/><stop offset="100%" stop-color="#c92a2a"/></linearGradient><linearGradient id="grad_duet_b" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#4dabf7"/><stop offset="100%" stop-color="#1864ab"/></linearGradient></defs><circle cx="21" cy="21" r="18" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="2"/><path d="M 21 6 A 15 15 0 0 1 21 36" fill="none" stroke="url(#grad_duet_r)" stroke-width="4.5" stroke-linecap="round"/><path d="M 21 36 A 15 15 0 0 1 21 6" fill="none" stroke="url(#grad_duet_b)" stroke-width="4.5" stroke-linecap="round"/><circle cx="21" cy="21" r="4.5" fill="#ffffff"/></svg>',

        '<svg viewBox="0 0 32 32" width="28" height="28" xmlns="http://www.w3.org/2000/svg"><circle cx="16" cy="16" r="13" fill="#e62429" stroke="#ffffff" stroke-width="2.5"/><circle cx="16" cy="16" r="6" fill="#ffffff" opacity="0.75"/></svg>',

        '<svg viewBox="0 0 44 44" width="38" height="38" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="grad_mb_chk" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ffe066"/><stop offset="50%" stop-color="#f59f00"/><stop offset="100%" stop-color="#d9480f"/></linearGradient></defs><circle cx="22" cy="22" r="18" fill="none" stroke="url(#grad_mb_chk)" stroke-width="3"/><circle cx="22" cy="22" r="13" fill="none" stroke="#fff" stroke-width="1.2" opacity="0.8"/><line x1="22" y1="4" x2="22" y2="40" stroke="url(#grad_mb_chk)" stroke-width="2.5"/><line x1="4" y1="22" x2="40" y2="22" stroke="url(#grad_mb_chk)" stroke-width="2.5"/><line x1="9.3" y1="9.3" x2="34.7" y2="34.7" stroke="url(#grad_mb_chk)" stroke-width="2.5"/><line x1="9.3" y1="34.7" x2="34.7" y2="9.3" stroke="url(#grad_mb_chk)" stroke-width="2.5"/><circle cx="22" cy="22" r="5" fill="#fff" stroke="#d9480f" stroke-width="2"/><circle cx="22" cy="22" r="2" fill="#d9480f"/></svg>',
        // Fiery Divine Astra Spark
        '<svg viewBox="0 0 32 32" width="28" height="28" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="grad_mb_fire" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#fff3bf"/><stop offset="40%" stop-color="#ff922b"/><stop offset="100%" stop-color="#e03131"/></linearGradient></defs><path d="M 16 2 Q 16 16 30 16 Q 16 16 16 30 Q 16 16 2 16 Q 16 16 16 2 Z" fill="url(#grad_mb_fire)" stroke="#fff" stroke-width="1.2"/><circle cx="16" cy="16" r="3" fill="#ffffff"/></svg>'
      ],

      theDot: [
        // Crimson Red Cartoon Dot
        '<svg viewBox="0 0 36 36" width="30" height="30" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="grad_dot_r" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ff6b6b"/><stop offset="70%" stop-color="#e62429"/><stop offset="100%" stop-color="#a61e22"/></linearGradient></defs><circle cx="18" cy="18" r="15" fill="url(#grad_dot_r)" stroke="#ffffff" stroke-width="2.5"/><circle cx="13" cy="15" r="2.2" fill="#ffffff"/><circle cx="23" cy="15" r="2.2" fill="#ffffff"/><path d="M 14 21 Q 18 25 22 21" stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>',
        // Sunflower Gold Winking Dot
        '<svg viewBox="0 0 36 36" width="30" height="30" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="grad_dot_g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ffe066"/><stop offset="70%" stop-color="#f59f00"/><stop offset="100%" stop-color="#d9480f"/></linearGradient></defs><circle cx="18" cy="18" r="15" fill="url(#grad_dot_g)" stroke="#ffffff" stroke-width="2.5"/><circle cx="13" cy="15" r="2.2" fill="#ffffff"/><path d="M 21 15 L 25 15" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/><path d="M 14 21 Q 18 25 22 21" stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>',
        // Electric Cyan Happy Dot
        '<svg viewBox="0 0 36 36" width="30" height="30" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="grad_dot_c" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#67e8f9"/><stop offset="70%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#0e7490"/></linearGradient></defs><circle cx="18" cy="18" r="15" fill="url(#grad_dot_c)" stroke="#ffffff" stroke-width="2.5"/><circle cx="13" cy="15" r="2.2" fill="#ffffff"/><circle cx="23" cy="15" r="2.2" fill="#ffffff"/><path d="M 14 21 Q 18 25 22 21" stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>'
      ]
    };

    function spawnGameParticles(gameType, originX, originY) {
      var tokenList = GAME_TOKENS[gameType] || GAME_TOKENS.samosa;
      var count = (gameType === 'mahabharata') ? 7 : (gameType === 'twosome' ? 5 : 6);

      // Trigger dedicated haptic pattern
      if (gameType === 'mahabharata') haptic.battle();
      else if (gameType === 'twosome') haptic.dualPulse();
      else if (gameType === 'runLittleOne') haptic.heartbeat();
      else if (gameType === 'duet') haptic.tap();
      else if (gameType === 'theDot') haptic.wiggle();
      else haptic.burst();

      for (var i = 0; i < count; i++) {
        var p = document.createElement('div');
        p.className = 'abso-game-particle';
        var svgContent = tokenList[i % tokenList.length];
        p.innerHTML = svgContent;
        p.style.left = (originX - 18) + 'px';
        p.style.top = (originY - 16) + 'px';
        document.body.appendChild(p);

        var tl = gsap.timeline({
          onComplete: (function(elem) {
            return function() {
              if (elem.parentNode) elem.parentNode.removeChild(elem);
            };
          })(p)
        });

        if (gameType === 'runLittleOne') {
          // Gentle floating wool/crystal drift in soft breeze
          var bX = gsap.utils.random(-75, 75);
          var bY = gsap.utils.random(-110, -180);
          tl.to(p, {
            x: bX,
            y: bY,
            rotation: gsap.utils.random(-90, 90),
            scale: gsap.utils.random(0.9, 1.25),
            duration: gsap.utils.random(0.5, 0.65),
            ease: 'power1.out'
          })
          .to(p, {
            x: bX + gsap.utils.random(-30, 30),
            y: bY - gsap.utils.random(30, 60),
            opacity: 0,
            scale: 0.8,
            duration: gsap.utils.random(0.65, 0.85),
            ease: 'sine.out'
          });
        } else if (gameType === 'twosome') {
          // Intertwined orbiting spiral burst
          var tX = gsap.utils.random(-95, 95);
          var tY = gsap.utils.random(-130, -200);
          tl.to(p, {
            x: tX,
            y: tY,
            rotation: gsap.utils.random(-360, 360),
            scale: gsap.utils.random(0.9, 1.3),
            duration: 0.48,
            ease: 'power2.out'
          })
          .to(p, {
            x: tX + gsap.utils.random(-40, 40),
            y: tY + gsap.utils.random(80, 130),
            rotation: '+=180',
            opacity: 0,
            duration: 0.65,
            ease: 'power1.in'
          });
        } else if (gameType === 'duet') {
          // High-speed acoustic pulse expansion
          var dX = gsap.utils.random(-70, 70);
          var dY = gsap.utils.random(-80, -150);
          tl.to(p, {
            x: dX,
            y: dY,
            scale: gsap.utils.random(1.4, 1.9),
            duration: 0.38,
            ease: 'power2.out'
          })
          .to(p, {
            scale: 2.3,
            opacity: 0,
            duration: 0.5,
            ease: 'power1.out'
          });
        } else if (gameType === 'mahabharata') {
          // Explosive spinning golden chakras & fierce fiery sparks
          var mX = gsap.utils.random(-110, 110);
          var mY = gsap.utils.random(-160, -250);
          var spin = gsap.utils.random(-540, 540);
          tl.to(p, {
            x: mX,
            y: mY,
            rotation: spin,
            scale: gsap.utils.random(1.0, 1.45),
            duration: 0.42,
            ease: 'power2.out'
          })
          .to(p, {
            x: mX + gsap.utils.random(-25, 25),
            y: mY + gsap.utils.random(130, 180),
            rotation: spin + gsap.utils.random(-180, 180),
            opacity: 0,
            duration: 0.65,
            ease: 'power2.in'
          });
        } else if (gameType === 'theDot') {
          // Bouncy rubber ball pop with elastic bounce
          var dotX = gsap.utils.random(-85, 85);
          var dotY = gsap.utils.random(-140, -210);
          tl.to(p, {
            x: dotX,
            y: dotY,
            scale: gsap.utils.random(0.95, 1.35),
            duration: 0.35,
            ease: 'power1.out'
          })
          .to(p, {
            y: dotY + 90,
            duration: 0.55,
            ease: 'bounce.out'
          })
          .to(p, {
            opacity: 0,
            scale: 0.6,
            duration: 0.25,
            ease: 'power1.in'
          });
        } else {
          // Samosa gravity tumble
          var sX = gsap.utils.random(-90, 90);
          var sY = gsap.utils.random(-130, -210);
          var sSpin = gsap.utils.random(-240, 240);
          tl.to(p, {
            x: sX,
            y: sY,
            rotation: sSpin,
            scale: gsap.utils.random(0.85, 1.3),
            duration: 0.45,
            ease: 'power2.out'
          })
          .to(p, {
            y: sY + gsap.utils.random(130, 180),
            x: sX + gsap.utils.random(-20, 20),
            rotation: sSpin + gsap.utils.random(-60, 60),
            opacity: 0,
            duration: 0.65,
            ease: 'power2.in'
          });
        }
      }
    }

    // 1. Attach particle triggers on Game Cards (Homepage & Games Page)
    var cardMappings = [
      { selector: '.abso-card a[href*="mb-cow"]', type: 'mahabharata' },
      { selector: '.abso-card a[href*="samosa-catcher"]', type: 'samosa' },
      { selector: '.abso-card a[href*="run-little-one"]', type: 'runLittleOne' },
      { selector: '.abso-card a[href*="twosome"]', type: 'twosome' },
      { selector: '.abso-card a[href*="duet"]', type: 'duet' },
      { selector: '.abso-panel--dot a[href*="the-dot"], .abso-panel--dot', type: 'theDot' }
    ];

    cardMappings.forEach(function(item) {
      var elements = document.querySelectorAll(item.selector);
      elements.forEach(function(el) {
        el.addEventListener('pointerdown', function(e) {
          var x = e.clientX || (window.innerWidth / 2);
          var y = e.clientY || (window.innerHeight / 2);
          spawnGameParticles(item.type, x, y);
        });
      });
    });

    // 2. Attach particle triggers on Dedicated Game Pages
    var currentPath = window.location.pathname.replace(/\/$/, '') || '/';
    var pageGameType = null;
    if (currentPath.indexOf('mb-cow') !== -1) pageGameType = 'mahabharata';
    else if (currentPath.indexOf('samosa-catcher') !== -1) pageGameType = 'samosa';
    else if (currentPath.indexOf('run-little-one') !== -1) pageGameType = 'runLittleOne';
    else if (currentPath.indexOf('twosome') !== -1) pageGameType = 'twosome';
    else if (currentPath.indexOf('duet') !== -1) pageGameType = 'duet';
    else if (currentPath.indexOf('the-dot') !== -1) pageGameType = 'theDot';

    if (pageGameType) {
      var pageElements = document.querySelectorAll(
        '.banner-wrapper, .banner-overlay, .info-banner-wrapper, .info-card, .img-rounded, .main-logo, .dot-section'
      );
      pageElements.forEach(function(el) {
        el.addEventListener('pointerdown', function(e) {
          var x = e.clientX || (window.innerWidth / 2);
          var y = e.clientY || (window.innerHeight / 2);
          spawnGameParticles(pageGameType, x, y);
        });
      });
    }


    // =========================================================================
    // 4. MAHABHARATA CODE OF WAR HERO GOLDEN LIGHT SHEEN & PARALLAX
    // =========================================================================
    var heroCard = document.querySelector('.abso-card--hero');
    if (heroCard) {
      var sheen = heroCard.querySelector('.abso-hero-sheen');
      if (!sheen) {
        sheen = document.createElement('div');
        sheen.className = 'abso-hero-sheen';
        sheen.setAttribute('aria-hidden', 'true');
        heroCard.appendChild(sheen);
      }

      if (typeof ScrollTrigger !== 'undefined') {
        gsap.fromTo(sheen,
          { xPercent: -120 },
          {
            xPercent: 120,
            duration: 1.4,
            ease: 'power2.inOut',
            scrollTrigger: {
              trigger: heroCard,
              start: 'top 85%',
              toggleActions: 'play none none none'
            }
          }
        );
      }

      heroCard.addEventListener('pointerenter', function() {
        gsap.fromTo(sheen,
          { xPercent: -120 },
          { xPercent: 120, duration: 1.1, ease: 'power1.inOut', overwrite: 'auto' }
        );
      });
    }


    // =========================================================================
    // 5. TACTILE 3D TILT & PARALLAX FOR SHOWCASE CARDS
    // =========================================================================
    var cards = document.querySelectorAll('.abso-card--hero, .abso-card--narrow');
    var isFinePointer = window.matchMedia && window.matchMedia('(pointer: fine)').matches;

    cards.forEach(function(card) {
      if (isFinePointer) {
        card.style.transformStyle = 'preserve-3d';
        card.style.perspective = '1000px';

        card.addEventListener('pointermove', function(e) {
          var rect = this.getBoundingClientRect();
          var x = (e.clientX - rect.left) / rect.width - 0.5;
          var y = (e.clientY - rect.top) / rect.height - 0.5;

          gsap.to(this, {
            rotationY: x * 6,
            rotationX: -y * 6,
            transformPerspective: 800,
            duration: 0.35,
            ease: 'power2.out',
            overwrite: 'auto'
          });
        });

        card.addEventListener('pointerleave', function() {
          gsap.to(this, {
            rotationX: 0,
            rotationY: 0,
            duration: 0.75,
            ease: 'elastic.out(1, 0.45)',
            overwrite: 'auto'
          });
        });
      }
    });


    // =========================================================================
    // 6. MASCOT FOOTER REACTION & WALKING DOTS STROLL
    // =========================================================================
    var dotsWrap = document.getElementById('abso-walking-dots-wrap');
    var dotsImg = document.getElementById('abso-walking-dots');
    var dotsSpeech = document.getElementById('abso-walking-dots-speech');

    if (dotsImg && typeof ScrollTrigger !== 'undefined') {
      // Horizontal stroll across track scrubbed by scroll
      gsap.fromTo(dotsImg, 
        { x: -28 },
        {
          x: 28,
          ease: 'none',
          scrollTrigger: {
            trigger: dotsWrap || dotsImg,
            start: 'top 95%',
            end: 'bottom 10%',
            scrub: 0.6
          }
        }
      );

      // Subtle step bob
      gsap.to(dotsImg, {
        y: -3,
        duration: 0.55,
        repeat: -1,
        yoyo: true,
        ease: 'power1.inOut'
      });
    }

    if (dotsWrap && dotsImg) {
      var walkingPhrases = [
        "wheee! 🏃‍♂️💨",
        "almost there! 🚩",
        "ticklish! 🤭",
        "keep rolling! ✨",
        "three dots on the run! 🐾"
      ];
      var walkPhraseIdx = 0;

      dotsWrap.addEventListener('click', function(e) {
        e.preventDefault();
        haptic.tap();
        walkPhraseIdx = (walkPhraseIdx + 1) % walkingPhrases.length;

        gsap.timeline()
          .to(dotsImg, { scaleX: 1.22, scaleY: 0.78, duration: 0.1, ease: 'power2.in' })
          .to(dotsImg, { scaleX: 0.9, scaleY: 1.18, y: -22, duration: 0.22, ease: 'power2.out' })
          .to(dotsImg, { scaleX: 1, scaleY: 1, y: 0, duration: 0.65, ease: 'elastic.out(1.3, 0.35)' });

        if (dotsSpeech) {
          dotsSpeech.textContent = walkingPhrases[walkPhraseIdx];
          gsap.timeline()
            .to(dotsSpeech, { scale: 1, opacity: 1, duration: 0.3, ease: 'back.out(2)' })
            .to(dotsSpeech, { scale: 0.8, opacity: 0, delay: 1.5, duration: 0.3 });
        }
      });

      // Footer links reaction
      var footerLinks = document.querySelectorAll('.abso-footer__links a');
      footerLinks.forEach(function(link) {
        link.addEventListener('pointerenter', function() {
          gsap.to(dotsImg, { x: 22, rotation: 3, scale: 1.05, duration: 0.35, ease: 'power2.out', overwrite: 'auto' });
        });
        link.addEventListener('pointerleave', function() {
          gsap.to(dotsImg, { x: 0, rotation: 0, scale: 1, duration: 0.55, ease: 'elastic.out(1.1, 0.4)', overwrite: 'auto' });
        });
      });
    }

    // Footer logo pulse
    var footerLogo = document.querySelector('.abso-footer__logo');
    if (footerLogo) {
      footerLogo.addEventListener('pointerenter', function() {
        gsap.to(this, { scale: 1.08, duration: 0.2, yoyo: true, repeat: 1, ease: 'power2.out' });
      });
    }


    // =========================================================================
    // 7. THE DOT EXPRESSION LAB & MOOD SWITCHER (the-dot.md)
    // =========================================================================
    var moodStage = document.getElementById('abso-mood-stage');
    if (moodStage) {
      var moodAvatar = document.getElementById('abso-mood-avatar');
      var moodImg = document.getElementById('abso-mood-img');
      var moodSpeech = document.getElementById('abso-mood-speech');
      var moodText = document.getElementById('abso-mood-text');
      var moodEmoji = document.getElementById('abso-mood-emoji');
      var pills = Array.from(moodStage.querySelectorAll('.abso-mood-pill'));

      var moods = pills.map(function(pill) {
        return {
          img: pill.getAttribute('data-img'),
          quote: pill.getAttribute('data-quote'),
          emoji: pill.getAttribute('data-emoji')
        };
      });

      var activeMoodIndex = 0;

      function applyMood(index) {
        if (!moods[index]) return;
        activeMoodIndex = index;

        haptic.wiggle();

        // Update pills active state
        pills.forEach(function(p, i) {
          if (i === index) {
            p.classList.add('is-active');
            gsap.fromTo(p, { scale: 0.9 }, { scale: 1, duration: 0.45, ease: 'elastic.out(1.3, 0.4)', overwrite: 'auto' });
          } else {
            p.classList.remove('is-active');
          }
        });

        // Update speech text with back ease
        if (moodSpeech && moodText && moodEmoji) {
          moodText.textContent = moods[index].quote;
          moodEmoji.textContent = moods[index].emoji;
          gsap.fromTo(moodSpeech, 
            { scale: 0.85, opacity: 0 }, 
            { scale: 1, opacity: 1, duration: 0.35, ease: 'back.out(1.7)', overwrite: 'auto' }
          );
        }

        // Squash & stretch avatar with fluid interruptibility
        if (moodAvatar && moodImg) {
          moodImg.src = moods[index].img;

          gsap.killTweensOf(moodAvatar);
          gsap.timeline()
            .to(moodAvatar, {
              scaleX: 1.20,
              scaleY: 0.80,
              duration: 0.1,
              ease: 'power2.in'
            })
            .to(moodAvatar, {
              scaleX: 0.92,
              scaleY: 1.14,
              y: -18,
              duration: 0.2,
              ease: 'power2.out'
            })
            .to(moodAvatar, {
              scaleX: 1,
              scaleY: 1,
              y: 0,
              duration: 0.55,
              ease: 'elastic.out(1.2, 0.38)'
            });
        }
      }

      // Tap avatar to cycle moods
      if (moodAvatar) {
        moodAvatar.addEventListener('click', function(e) {
          e.preventDefault();
          var next = (activeMoodIndex + 1) % moods.length;
          applyMood(next);
        });
        moodAvatar.addEventListener('keydown', function(e) {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            var next = (activeMoodIndex + 1) % moods.length;
            applyMood(next);
          }
        });
      }

      // Pill click
      pills.forEach(function(pill, i) {
        pill.addEventListener('click', function(e) {
          e.preventDefault();
          applyMood(i);
        });
      });
    }


    // =========================================================================
    // 8. LOST IN THE 404 MAZE INTERACTIVE PAGE (404.md)
    // =========================================================================
    var playground404 = document.querySelector('.abso-404-playground');
    if (playground404) {
      // 1. Floating zero-gravity question marks and dots
      var q1 = document.querySelector('.abso-404-floatie--q1');
      var q2 = document.querySelector('.abso-404-floatie--q2');
      var d1 = document.querySelector('.abso-404-floatie--dot1');
      var d2 = document.querySelector('.abso-404-floatie--dot2');

      if (q1) gsap.to(q1, { y: -18, rotation: -14, duration: 2.2, repeat: -1, yoyo: true, ease: 'sine.inOut' });
      if (q2) gsap.to(q2, { y: 22, rotation: 16, duration: 2.8, repeat: -1, yoyo: true, ease: 'sine.inOut' });
      if (d1) gsap.to(d1, { y: -14, x: 8, duration: 2.5, repeat: -1, yoyo: true, ease: 'sine.inOut' });
      if (d2) gsap.to(d2, { y: 16, x: -10, duration: 3.1, repeat: -1, yoyo: true, ease: 'sine.inOut' });

      // 2. Interactive magnetic compass needle
      var needle = document.getElementById('abso-404-needle');
      var compass = document.getElementById('abso-404-compass');
      if (needle && compass) {
        playground404.addEventListener('pointermove', function(e) {
          var rect = compass.getBoundingClientRect();
          var cx = rect.left + rect.width / 2;
          var cy = rect.top + rect.height / 2;
          var rad = Math.atan2(e.clientY - cy, e.clientX - cx);
          var deg = rad * (180 / Math.PI) + 90;
          gsap.to(needle, { rotation: deg, duration: 0.35, ease: 'power2.out', overwrite: 'auto' });
        });

        compass.addEventListener('click', function(e) {
          e.stopPropagation();
          haptic.burst();
          gsap.to(needle, { rotation: '+=720', duration: 1.1, ease: 'elastic.out(1, 0.35)', overwrite: 'auto' });
        });
      }

      // 3. Poke The Dot in 404 maze
      var card404 = document.getElementById('abso-404-card');
      var speech404 = document.getElementById('abso-404-speech');
      var phrases404 = [
        "“Wait... is this exit 404 or entry 404?!”",
        "“Don't panic! I found a crumb of samosa!”",
        "“I've been running in circles for hours!”",
        "“Follow the compass home!”",
        "“Ouch! Still stuck in the labyrinth!”"
      ];
      var phraseIdx = 0;

      if (card404) {
        card404.addEventListener('click', function() {
          haptic.bump();
          phraseIdx = (phraseIdx + 1) % phrases404.length;

          var img = document.getElementById('abso-404-img');
          if (img) {
            gsap.timeline()
              .to(img, { scaleX: 1.18, scaleY: 0.82, duration: 0.1, ease: 'power2.in' })
              .to(img, { scaleX: 0.92, scaleY: 1.14, y: -22, duration: 0.22, ease: 'power2.out' })
              .to(img, { scaleX: 1, scaleY: 1, y: 0, duration: 0.6, ease: 'elastic.out(1.2, 0.35)' });
          }

          if (speech404) {
            gsap.timeline()
              .to(speech404, { scale: 0.85, opacity: 0, duration: 0.1, onComplete: function() {
                speech404.textContent = phrases404[phraseIdx];
              }})
              .to(speech404, { scale: 1, opacity: 1, duration: 0.35, ease: 'back.out(1.8)' });
          }
        });
      }
    }


    // =========================================================================
    // 9. LOGO RED DOT WOBBLE ON INTERACTION
    // =========================================================================
    var logoImg = document.querySelector('.abso-logo');
    if (logoImg) {
      logoImg.addEventListener('pointerenter', function() {
        gsap.to(this, { scale: 1.05, duration: 0.18, ease: 'power1.out' });
      });
      logoImg.addEventListener('pointerleave', function() {
        gsap.to(this, { scale: 1, duration: 0.4, ease: 'elastic.out(1.1, 0.4)' });
      });
    }


    // =========================================================================
    // 10. SCROLL-DRIVEN FALLING CLAY COINS (HOMEPAGE)
    // =========================================================================
    var currentPathname = window.location.pathname.replace(/\/$/, '') || '/';
    var isHomepage = (currentPathname === '/' || currentPathname === '' || !!document.querySelector('.abso-panel--about'));

    if (isHomepage) {
      var COIN_SVG_STAR = '<svg viewBox="0 0 40 40" width="34" height="34" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="cGradStar" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#fff3bf"/><stop offset="35%" stop-color="#ffd43b"/><stop offset="70%" stop-color="#f59f00"/><stop offset="100%" stop-color="#b45309"/></linearGradient></defs><circle cx="20" cy="20" r="18" fill="url(#cGradStar)" stroke="#92400e" stroke-width="2.2"/><circle cx="20" cy="20" r="13" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.85"/><polygon points="20,10 22.8,16 29,16.5 24.3,20.5 25.8,27 20,23.3 14.2,27 15.7,20.5 11,16.5 17.2,16" fill="#ffffff" opacity="0.95"/><circle cx="15" cy="13" r="1.8" fill="#ffffff" opacity="0.7"/></svg>';
      var COIN_SVG_DOT = '<svg viewBox="0 0 40 40" width="34" height="34" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="cGradDot" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#fff3bf"/><stop offset="35%" stop-color="#fcc419"/><stop offset="70%" stop-color="#e67700"/><stop offset="100%" stop-color="#92400e"/></linearGradient></defs><circle cx="20" cy="20" r="18" fill="url(#cGradDot)" stroke="#78350f" stroke-width="2.2"/><circle cx="20" cy="20" r="13" fill="none" stroke="#ffffff" stroke-width="1.3" opacity="0.85"/><circle cx="20" cy="20" r="5.5" fill="#e62429" stroke="#ffffff" stroke-width="1.2"/><circle cx="18" cy="18" r="1.5" fill="#ffffff" opacity="0.85"/></svg>';

      var lastScrollY = window.pageYOffset || document.documentElement.scrollTop;
      var accumulatedScroll = 0;
      var activeCoinCount = 0;
      var maxCoinsOnScreen = 20;
      var lastSpawnTime = 0;

      function spawnFallingCoin() {
        if (activeCoinCount >= maxCoinsOnScreen) return;
        activeCoinCount++;

        var coin = document.createElement('div');
        coin.className = 'abso-falling-coin';
        coin.innerHTML = (Math.random() > 0.45) ? COIN_SVG_STAR : COIN_SVG_DOT;

        // Spread across horizontal width with margins
        var startX = gsap.utils.random(window.innerWidth * 0.05, window.innerWidth * 0.95);
        var startY = -45;

        coin.style.left = startX + 'px';
        coin.style.top = startY + 'px';
        document.body.appendChild(coin);

        // Tap mid-air to pop coin!
        coin.addEventListener('pointerdown', function(e) {
          e.stopPropagation();
          haptic.burst();
          gsap.killTweensOf(coin);
          gsap.to(coin, {
            scale: 1.45,
            opacity: 0,
            duration: 0.18,
            ease: 'back.out(2)',
            onComplete: function() {
              if (coin.parentNode) coin.parentNode.removeChild(coin);
              activeCoinCount--;
            }
          });
        });

        var driftX = gsap.utils.random(-70, 70);
        var fallDistance = window.innerHeight * gsap.utils.random(0.65, 0.98);
        var duration = gsap.utils.random(1.3, 2.0);
        var scale = gsap.utils.random(0.75, 1.15);
        var spinY = gsap.utils.random(360, 1080) * (Math.random() > 0.5 ? 1 : -1);
        var spinZ = gsap.utils.random(-180, 180);

        var tl = gsap.timeline({
          onComplete: function() {
            if (coin.parentNode) coin.parentNode.removeChild(coin);
            activeCoinCount--;
          }
        });

        // Natural accelerated gravity fall with 3D tumbling
        tl.to(coin, {
          y: fallDistance,
          x: driftX,
          rotationY: spinY,
          rotationZ: spinZ,
          scale: scale,
          duration: duration,
          ease: 'power1.in'
        })
        .to(coin, {
          opacity: 0,
          scale: scale * 0.7,
          duration: 0.3,
          ease: 'power2.out'
        }, '-=0.3');
      }

      window.addEventListener('scroll', function() {
        var currentY = window.pageYOffset || document.documentElement.scrollTop;
        var delta = Math.abs(currentY - lastScrollY);
        lastScrollY = currentY;

        accumulatedScroll += delta;
        var now = Date.now();

        // Spawn a coin every ~75px of scroll delta, rate limited to max once every 80ms
        if (accumulatedScroll >= 75 && (now - lastSpawnTime > 80)) {
          accumulatedScroll = 0;
          lastSpawnTime = now;
          spawnFallingCoin();

          // If fast scroll, drop an extra staggered coin!
          if (delta > 65 && activeCoinCount < maxCoinsOnScreen) {
            setTimeout(function() {
              spawnFallingCoin();
            }, 60);
          }
        }
      }, { passive: true });
    }

  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initAbsoGsap);
  } else {
    initAbsoGsap();
  }
})();
</script>
