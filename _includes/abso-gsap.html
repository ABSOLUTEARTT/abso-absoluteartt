<!-- abso. GSAP Motion & Tactile Physics Engine (v0.4.1.2-GSAP) -->
<script src="{{ '/assets/js/vendor/gsap.min.js' | relative_url }}"></script>
<script src="{{ '/assets/js/vendor/ScrollTrigger.min.js' | relative_url }}"></script>

<script>
(function() {
  'use strict';

  // Respect user preference for reduced motion
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    return;
  }

  function initAbsoGsap() {
    if (typeof gsap === 'undefined') return;

    if (typeof ScrollTrigger !== 'undefined') {
      gsap.registerPlugin(ScrollTrigger);
    }

    // =========================================================================
    // 1. CLAY DOUGH "SQUASH & STRETCH" TACTILE PHYSICS
    // =========================================================================
    var interactiveElements = document.querySelectorAll(
      '.hamburger-btn, .abso-logo-link, .abso-nav-overlay .nav-links li a, .abso-footer__links a'
    );

    interactiveElements.forEach(function(el) {
      // Squash on press
      el.addEventListener('pointerdown', function() {
        gsap.to(this, {
          scaleX: 1.08,
          scaleY: 0.92,
          duration: 0.12,
          ease: 'power2.out',
          overwrite: 'auto'
        });
      });

      // Elastic rubbery recovery on release
      function releaseSquash() {
        gsap.to(el, {
          scaleX: 1,
          scaleY: 1,
          duration: 0.65,
          ease: 'elastic.out(1.2, 0.38)',
          overwrite: 'auto'
        });
      }

      el.addEventListener('pointerup', releaseSquash);
      el.addEventListener('pointercancel', releaseSquash);
      el.addEventListener('pointerleave', releaseSquash);
    });


    // =========================================================================
    // 2. SCROLL-DRIVEN "WALKING DOTS" & FOOTSTEP WOBBLE (ScrollTrigger)
    // =========================================================================
    var walkingDots = document.querySelector('.abso-walking-dots');
    if (walkingDots && typeof ScrollTrigger !== 'undefined') {
      // Horizontal walking stroll across track tied directly to scroll progress
      gsap.fromTo(walkingDots, 
        { x: -28 },
        {
          x: 28,
          ease: 'none',
          scrollTrigger: {
            trigger: walkingDots,
            start: 'top 95%',
            end: 'bottom 10%',
            scrub: 0.6
          }
        }
      );

      // Subtle lifelike walking bob (feet stepping rhythm)
      gsap.to(walkingDots, {
        y: -3,
        duration: 0.55,
        repeat: -1,
        yoyo: true,
        ease: 'power1.inOut'
      });
    }


    // =========================================================================
    // 3. TACTILE 3D TILT & PARALLAX FOR SHOWCASE CARDS
    // =========================================================================
    var cards = document.querySelectorAll('.abso-card--hero, .abso-card--narrow');
    var isFinePointer = window.matchMedia && window.matchMedia('(pointer: fine)').matches;

    cards.forEach(function(card) {
      // Card scroll entrance micro-polish
      if (typeof ScrollTrigger !== 'undefined') {
        gsap.fromTo(card, 
          { y: 16, opacity: 0.94 },
          {
            y: 0,
            opacity: 1,
            duration: 0.6,
            ease: 'power2.out',
            scrollTrigger: {
              trigger: card,
              start: 'top 88%',
              toggleActions: 'play none none none'
            }
          }
        );
      }

      // 3D perspective tilt on hover/pointer move (desktop & fine pointers)
      if (isFinePointer) {
        card.style.transformStyle = 'preserve-3d';
        card.style.perspective = '1000px';

        card.addEventListener('pointermove', function(e) {
          var rect = this.getBoundingClientRect();
          var x = (e.clientX - rect.left) / rect.width - 0.5;
          var y = (e.clientY - rect.top) / rect.height - 0.5;

          gsap.to(this, {
            rotationY: x * 6,
            rotationX: -y * 6,
            transformPerspective: 800,
            duration: 0.35,
            ease: 'power2.out',
            overwrite: 'auto'
          });
        });

        card.addEventListener('pointerleave', function() {
          gsap.to(this, {
            rotationX: 0,
            rotationY: 0,
            duration: 0.75,
            ease: 'elastic.out(1, 0.45)',
            overwrite: 'auto'
          });
        });
      }
    });


    // =========================================================================
    // 4. CHOREOGRAPHED HAMMER MENU POP & SPRING STAGGER
    // =========================================================================
    var menuToggle = document.getElementById('abso-menu-toggle');
    var navMenu = document.getElementById('abso-nav-menu');

    if (menuToggle && navMenu) {
      var navItems = navMenu.querySelectorAll('.nav-links li');

      // Intercept active toggle to apply juicy GSAP spring timeline
      var observer = new MutationObserver(function(mutations) {
        mutations.forEach(function(mutation) {
          if (mutation.attributeName === 'class') {
            var isActive = navMenu.classList.contains('active');
            if (isActive) {
              // Opening: Spring card bloom + staggered token drop
              gsap.killTweensOf(navMenu);
              gsap.killTweensOf(navItems);

              gsap.fromTo(navMenu, 
                { scale: 0.90, y: -12, opacity: 0 },
                { scale: 1, y: 0, opacity: 1, duration: 0.38, ease: 'back.out(1.6)', overwrite: 'auto' }
              );

              gsap.fromTo(navItems,
                { y: 20, scale: 0.86, opacity: 0 },
                { 
                  y: 0, 
                  scale: 1, 
                  opacity: 1, 
                  stagger: 0.055, 
                  duration: 0.42, 
                  ease: 'back.out(1.85)',
                  delay: 0.06,
                  overwrite: 'auto'
                }
              );

              // Playful button icon pop
              gsap.fromTo(menuToggle, 
                { scale: 0.88, rotation: -12 },
                { scale: 1, rotation: 0, duration: 0.45, ease: 'elastic.out(1.3, 0.45)' }
              );

            } else {
              // Closing: Quick crisp collapse
              gsap.to(navMenu, {
                scale: 0.94,
                y: -8,
                opacity: 0,
                duration: 0.22,
                ease: 'power2.in',
                overwrite: 'auto'
              });
            }
          }
        });
      });

      observer.observe(navMenu, { attributes: true });
    }


    // =========================================================================
    // 5. "THE DOT" & MASCOT PLAYFUL MICRO-PHYSICS
    // =========================================================================
    // Floating character micro-drifts
    var floatingHome = document.querySelector('.nav-item-home img');
    var floatingGames = document.querySelector('.nav-item-games img');
    var floatingDot = document.querySelector('.nav-item-the-dot img');
    var floatingContact = document.querySelector('.nav-item-contact img');

    if (floatingHome) {
      gsap.to(floatingHome, { y: -3.5, duration: 2.4, repeat: -1, yoyo: true, ease: 'sine.inOut', delay: 0.1 });
    }
    if (floatingGames) {
      gsap.to(floatingGames, { y: -4, rotation: 1, duration: 2.1, repeat: -1, yoyo: true, ease: 'sine.inOut', delay: 0.3 });
    }
    if (floatingDot) {
      gsap.to(floatingDot, { y: -3, rotation: -1, duration: 2.7, repeat: -1, yoyo: true, ease: 'sine.inOut', delay: 0.5 });
    }
    if (floatingContact) {
      gsap.to(floatingContact, { y: -3.5, rotation: 0.8, duration: 2.3, repeat: -1, yoyo: true, ease: 'sine.inOut', delay: 0.2 });
    }

    // Playful wobble for the abso. red dot in header logo on click/tap
    var logoImg = document.querySelector('.abso-logo');
    if (logoImg) {
      logoImg.addEventListener('pointerenter', function() {
        gsap.to(this, { scale: 1.05, duration: 0.18, ease: 'power1.out' });
      });
      logoImg.addEventListener('pointerleave', function() {
        gsap.to(this, { scale: 1, duration: 0.4, ease: 'elastic.out(1.1, 0.4)' });
      });
    }

  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initAbsoGsap);
  } else {
    initAbsoGsap();
  }
})();
</script>
