<script>
(function() {
  'use strict';

  // 1. Accessibility guardrail: check prefers-reduced-motion
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    return;
  }

  // 2. Browser feature check: IntersectionObserver
  if (!('IntersectionObserver' in window)) {
    return;
  }

  function initScrollMotion() {
    // Flag to activate scroll-motion CSS
    document.documentElement.classList.add('abso-scroll-motion');

    // Targeted card components
    var selector = [
      '.abso-card--hero',
      '.abso-card--narrow',
      '.abso-panel--about',
      '.abso-panel--dot',
      '.info-card',
      '.info-banner-wrapper',
      '.img-rounded',
      '.dot-section'
    ].join(', ');

    var cards = Array.from(document.querySelectorAll(selector));
    if (!cards.length) return;

    // Track scroll direction passively
    var lastScrollY = window.pageYOffset || document.documentElement.scrollTop;
    var scrollDirection = 'down';

    window.addEventListener('scroll', function() {
      var currentY = window.pageYOffset || document.documentElement.scrollTop;
      scrollDirection = currentY >= lastScrollY ? 'down' : 'up';
      lastScrollY = currentY;
    }, { passive: true });

    // Mark cards already visible above the fold to settle immediately
    var vh = window.innerHeight || document.documentElement.clientHeight;
    var initialBatchCount = 0;

    cards.forEach(function(card) {
      var rect = card.getBoundingClientRect();
      var inView = rect.top < vh * 0.90 && rect.bottom > 0;

      if (inView) {
        card.classList.add('abso-reactive-card', 'is-settled');
        var delay = Math.min(initialBatchCount * 30, 90);
        card.style.setProperty('--stagger-delay', delay + 'ms');
        initialBatchCount++;
        setTimeout(function() {
          card.classList.add('is-motion-done');
        }, delay + 360);
      } else {
        // Below the fold: prep for scroll entrance
        card.classList.add('abso-reactive-card');
      }
    });

    // Observer for entering cards
    var batchIndex = 0;
    var batchTimer = null;

    var observer = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          var card = entry.target;
          observer.unobserve(card);

          // Direction-aware vertical displacement
          if (scrollDirection === 'down') {
            card.style.setProperty('--abso-scroll-displacement', '6px');
          } else {
            card.style.setProperty('--abso-scroll-displacement', '-4px');
          }

          // Subtle stagger for elements entering together
          var currentBatchIndex = batchIndex++;
          var stagger = Math.min(currentBatchIndex * 35, 105);
          card.style.setProperty('--stagger-delay', stagger + 'ms');

          // Trigger settle transition
          requestAnimationFrame(function() {
            card.classList.add('is-settled');
            setTimeout(function() {
              card.classList.add('is-motion-done');
            }, stagger + 360);
          });

          // Reset batch index on idle
          clearTimeout(batchTimer);
          batchTimer = setTimeout(function() {
            batchIndex = 0;
          }, 80);
        }
      });
    }, {
      root: null,
      rootMargin: '0px 0px -30px 0px',
      threshold: 0.05
    });

    // Observe cards that haven't settled yet
    cards.forEach(function(card) {
      if (!card.classList.contains('is-settled')) {
        observer.observe(card);
      }
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initScrollMotion);
  } else {
    initScrollMotion();
  }
})();
</script>
