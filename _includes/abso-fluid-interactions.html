<script>
(function() {
  'use strict';

  // 1. Accessibility guardrail: check prefers-reduced-motion
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    return;
  }

  function initFluidInteractions() {
    // 1. Home, Previous, Next navigation buttons
    var navLinks = document.querySelectorAll('.home-wrapper a');
    navLinks.forEach(function(link) {
      link.addEventListener('click', function(e) {
        if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
        var href = this.getAttribute('href');
        if (!href || href === '#' || href.indexOf('mailto:') === 0) return;

        var currentPath = window.location.pathname.replace(/\/$/, '') || '/';
        var targetUrl;
        try {
          targetUrl = new URL(this.href, window.location.origin);
        } catch(err) {
          targetUrl = { pathname: href };
        }
        var targetPath = targetUrl.pathname.replace(/\/$/, '') || '/';
        if (currentPath === targetPath) return;

        e.preventDefault();
        this.classList.add('is-selected');

        setTimeout(function() {
          window.location.href = href;
        }, 120);
      });
    });

    // 2. Game cards on Homepage and Games page
    var cardLinks = document.querySelectorAll('.abso-card a, .abso-panel a');
    cardLinks.forEach(function(link) {
      link.addEventListener('click', function(e) {
        if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
        var href = this.getAttribute('href');
        if (!href || href === '#' || href.indexOf('mailto:') === 0) return;

        var parentCard = this.closest('.abso-card') || this.closest('.abso-panel');
        if (!parentCard) return;

        e.preventDefault();
        parentCard.classList.add('is-selected');

        setTimeout(function() {
          window.location.href = href;
        }, 130);
      });
    });

    // 3. Reset selection states when navigating via Back/Forward cache (bfcache)
    window.addEventListener('pageshow', function() {
      document.querySelectorAll('.is-selected').forEach(function(el) {
        el.classList.remove('is-selected');
      });
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initFluidInteractions);
  } else {
    initFluidInteractions();
  }
})();
</script>
