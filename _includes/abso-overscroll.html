<script>
(function() {
  'use strict';

  // 1. Accessibility guardrail: respect prefers-reduced-motion
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    return;
  }

  // 2. Hardware / OS detection
  // iOS devices (iPhone, iPad) and macOS trackpads have native WebKit rubber-band physics.
  // We avoid adding duplicate translations on those environments.
  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || 
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var isMac = /Macintosh|MacIntel|MacPPC|Mac68K/.test(navigator.platform);

  function initOverscroll() {
    var container = document.querySelector('.abso-container');
    if (!container) return;

    var touchStartY = 0;
    var touchStartX = 0;
    var isTrackingTouch = false;
    var isOverscrolling = false;
    var currentDisp = 0;
    var settleTimer = null;
    var wheelSettleTimer = null;

    function getScrollMetrics() {
      var scrollTop = window.pageYOffset || document.documentElement.scrollTop || document.body.scrollTop || 0;
      var scrollHeight = document.documentElement.scrollHeight || document.body.scrollHeight || 0;
      var clientHeight = window.innerHeight || document.documentElement.clientHeight || 0;
      return {
        top: scrollTop,
        isAtTop: scrollTop <= 1,
        isAtBottom: (scrollTop + clientHeight >= scrollHeight - 3)
      };
    }

    // Touch event handlers for Android Chrome & touch devices (Non-iOS)
    if (!isIOS) {
      document.addEventListener('touchstart', function(e) {
        if (!e.touches || e.touches.length !== 1) {
          isTrackingTouch = false;
          return;
        }
        touchStartY = e.touches[0].clientY;
        touchStartX = e.touches[0].clientX;
        isTrackingTouch = true;
        isOverscrolling = false;
        currentDisp = 0;
      }, { passive: true });

      document.addEventListener('touchmove', function(e) {
        if (!isTrackingTouch || !e.touches || e.touches.length !== 1) return;

        var currentY = e.touches[0].clientY;
        var currentX = e.touches[0].clientX;
        var deltaY = currentY - touchStartY;
        var deltaX = currentX - touchStartX;

        // Discard if gesture is predominantly horizontal (e.g. swipe navigation)
        if (Math.abs(deltaX) > Math.abs(deltaY) && !isOverscrolling) return;

        var metrics = getScrollMetrics();

        // Bottom boundary overscroll: user pulls UP when already at bottom
        if (metrics.isAtBottom && deltaY < -2) {
          var pull = Math.abs(deltaY);
          isOverscrolling = true;
          // Apple-style power curve: soft initial response, gentle saturation
          var maxDisp = window.innerWidth <= 520 ? 8 : 10;
          var disp = -Math.min(maxDisp, Math.pow(pull, 0.52) * 0.7);
          currentDisp = disp;

          container.style.willChange = 'transform';
          container.style.transition = 'none';
          container.style.transform = 'translate3d(0, ' + disp.toFixed(2) + 'px, 0)';
        }
      }, { passive: true });

      function endTouch() {
        if (!isTrackingTouch && !isOverscrolling) return;
        isTrackingTouch = false;

        if (isOverscrolling || currentDisp !== 0) {
          isOverscrolling = false;
          currentDisp = 0;

          // Apple ease-out settling curve (260ms duration)
          container.style.transition = 'transform 260ms cubic-bezier(0.16, 1, 0.3, 1)';
          container.style.transform = 'translate3d(0, 0px, 0)';

          clearTimeout(settleTimer);
          settleTimer = setTimeout(function() {
            container.style.transition = '';
            container.style.transform = '';
            container.style.willChange = '';
          }, 280);
        }
      }

      document.addEventListener('touchend', endTouch, { passive: true });
      document.addEventListener('touchcancel', endTouch, { passive: true });
    }

    // Wheel event handler for Desktop (Windows / Linux / Non-Mac)
    if (!isMac && !isIOS) {
      window.addEventListener('wheel', function(e) {
        // Discard horizontal wheel actions
        if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;

        var metrics = getScrollMetrics();

        // Wheeling down beyond bottom boundary
        if (metrics.isAtBottom && e.deltaY > 0) {
          var pullDown = Math.min(Math.abs(e.deltaY), 50);
          var dispDown = -Math.min(8, Math.pow(pullDown, 0.5) * 0.85);

          container.style.willChange = 'transform';
          container.style.transition = 'transform 70ms ease-out';
          container.style.transform = 'translate3d(0, ' + dispDown.toFixed(2) + 'px, 0)';

          clearTimeout(wheelSettleTimer);
          wheelSettleTimer = setTimeout(function() {
            container.style.transition = 'transform 260ms cubic-bezier(0.16, 1, 0.3, 1)';
            container.style.transform = 'translate3d(0, 0px, 0)';
            setTimeout(function() {
              container.style.transition = '';
              container.style.transform = '';
              container.style.willChange = '';
            }, 280);
          }, 90);
        }
        // Wheeling up beyond top boundary
        else if (metrics.isAtTop && e.deltaY < 0) {
          var pullUp = Math.min(Math.abs(e.deltaY), 50);
          var dispUp = Math.min(6, Math.pow(pullUp, 0.5) * 0.7);

          container.style.willChange = 'transform';
          container.style.transition = 'transform 70ms ease-out';
          container.style.transform = 'translate3d(0, ' + dispUp.toFixed(2) + 'px, 0)';

          clearTimeout(wheelSettleTimer);
          wheelSettleTimer = setTimeout(function() {
            container.style.transition = 'transform 260ms cubic-bezier(0.16, 1, 0.3, 1)';
            container.style.transform = 'translate3d(0, 0px, 0)';
            setTimeout(function() {
              container.style.transition = '';
              container.style.transform = '';
              container.style.willChange = '';
            }, 280);
          }, 90);
        }
      }, { passive: true });
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initOverscroll);
  } else {
    initOverscroll();
  }
})();
</script>
